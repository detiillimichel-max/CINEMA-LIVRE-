name: Coletar Internet Archive

on:
  workflow_dispatch:
    inputs:
      max_itens:
        description: "Máximo de itens por setor (vazio = limite configurado)"
        required: false
        default: ""
        type: string
      setores:
        description: "IDs dos setores separados por vírgula (vazio = todos)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 6 1 * *"
  push:
    paths:
      - "setores.json"
      - "coletar_archive.py"
      - "atualizar.py"
      - ".github/workflows/coletar.yml"

permissions:
  contents: write

concurrency:
  group: coletar-archive
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Varrer o Internet Archive
        env:
          MAX_ITENS_SETOR: ${{ github.event.inputs.max_itens }}
          SETORES: ${{ github.event.inputs.setores }}
        run: python coletar_archive.py

      - name: Resumo da coleta
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("indice.json")
          if not p.exists():
              print("indice.json ainda não foi criado.")
              raise SystemExit(0)

          data = json.loads(p.read_text(encoding="utf-8"))
          linhas = [
              "## Resultado da coleta — Internet Archive",
              "",
              "| Setor | Itens salvos | Total encontrado | Partes JSON |",
              "|---|---:|---:|---:|",
          ]
          for s in data.get("setores", []):
              linhas.append(
                  f"| {s.get('titulo', s.get('id', '—'))} "
                  f"| {s.get('salvos', 0)} "
                  f"| {s.get('total', 0)} "
                  f"| {s.get('partes', 0)} |"
              )
          linhas += [
              "",
              f"**Total salvo:** {sum(s.get('salvos', 0) for s in data.get('setores', [])):,}",
              f"**Atualizado em:** {data.get('atualizadoEm', '—')}",
          ]
          resumo = "\n".join(linhas)
          print(resumo)
          destino = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with destino.open("a", encoding="utf-8") as f:
              f.write(resumo + "\n")
          PY

      - name: Salvar catálogo no repositório
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- indice.json setores
          if git diff --cached --quiet; then
            echo "Sem mudanças no catálogo."
          else
            git commit -m "chore: atualiza catálogo do Internet Archive"
            git push
          fi
